name: Build mkLS Windows portable single EXE

on:
  push:
    branches:
      - mkls-windows-build

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"
  LZMA_SDK_VERSION: "2602"
  LZMA_SDK_SHA256: "2878c85f5f43a4a4e0952b1fd4e5fe097c1c143997a8047c7e1e788892aa9357"

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4

      - name: Checkout LocalSend 1.18.0 source
        uses: actions/checkout@v4
        with:
          repository: localsend/localsend
          ref: v1.18.0
          submodules: recursive
          path: src

      - name: Apply mkLS source changes and icon
        shell: pwsh
        run: |
          function Expand-GzipFile([string]$InputPath, [string]$OutputPath) {
            $inputStream = [IO.File]::OpenRead($InputPath)
            $gzipStream = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
            $outputStream = [IO.File]::Create($OutputPath)
            try { $gzipStream.CopyTo($outputStream) }
            finally {
              $outputStream.Dispose()
              $gzipStream.Dispose()
              $inputStream.Dispose()
            }
          }

          $patchBytes = [Convert]::FromBase64String((Get-Content build\mkls-code.patch.gz.b64 -Raw))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\mkls-code.patch.gz", $patchBytes)
          Expand-GzipFile "$env:RUNNER_TEMP\mkls-code.patch.gz" "$env:RUNNER_TEMP\mkls-code.patch"
          git -C src apply --whitespace=nowarn "$env:RUNNER_TEMP\mkls-code.patch"

          Get-ChildItem src\app\assets\i18n, src\app\lib\gen -Recurse -File | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            [IO.File]::WriteAllText($_.FullName, $text.Replace('LocalSend', 'mkLS'), [Text.UTF8Encoding]::new($false))
          }

          $iconBytes = [Convert]::FromBase64String((Get-Content build\mkls-icon.ico.gz.b64 -Raw))
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\mkls-icon.ico.gz", $iconBytes)
          Expand-GzipFile "$env:RUNNER_TEMP\mkls-icon.ico.gz" "src\app\windows\runner\resources\app_icon.ico"

          New-Item -ItemType Directory -Force src\support\portable | Out-Null
          Copy-Item support\portable\* src\support\portable -Force

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: src/support/portable/package-lock.json

      - name: Build MSIX helper required by the Windows project
        shell: pwsh
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr src\support\build\msix\content /cf src\support\build\msix\priconfig.xml /mn src\support\build\msix\content\AppxManifest.xml /of src\support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d src\support\build\msix\content /nv /p src\app\windows\localsend_msix_helper.msix

      - name: Install Flutter dependencies
        working-directory: src/app
        run: flutter pub get

      - name: Analyze changed Dart source
        working-directory: src/app
        run: flutter analyze --no-fatal-infos

      - name: Build mkLS for Windows x64
        working-directory: src/app
        run: flutter build windows --release

      - name: Add Visual C++ runtime libraries
        shell: pwsh
        run: |
          $release = 'src\app\build\windows\x64\runner\Release'
          Copy-Item src\support\build\windows\x64\msvcp140.dll $release
          Copy-Item src\support\build\windows\x64\vcruntime140.dll $release
          Copy-Item src\support\build\windows\x64\vcruntime140_1.dll $release

      - name: Build single portable EXE
        shell: pwsh
        run: |
          npm ci --prefix src\support\portable
          Invoke-WebRequest "https://www.7-zip.org/a/lzma${env:LZMA_SDK_VERSION}.7z" -OutFile "$env:RUNNER_TEMP\lzma-sdk.7z"
          $actualHash = (Get-FileHash "$env:RUNNER_TEMP\lzma-sdk.7z" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LZMA_SDK_SHA256) { throw "LZMA SDK checksum mismatch: $actualHash" }
          7z x "$env:RUNNER_TEMP\lzma-sdk.7z" "-o$env:RUNNER_TEMP\lzma-sdk" -y
          $sevenZip = Get-ChildItem "$env:RUNNER_TEMP\lzma-sdk" -Filter 7zr.exe -Recurse | Select-Object -First 1
          $sfx = Get-ChildItem "$env:RUNNER_TEMP\lzma-sdk" -Filter 7zS2.sfx -Recurse | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          .\src\support\portable\build_mkls_single.ps1 `
            -ReleaseDirectory src\app\build\windows\x64\runner\Release `
            -SevenZipPath $sevenZip.FullName `
            -SfxModulePath $sfx.FullName `
            -OutputPath dist\mkLS-1.18.0-Windows-x64-Portable-Single-ReadableUI.exe `
            -Version "1.18.0.60"
          Get-FileHash dist\mkLS-1.18.0-Windows-x64-Portable-Single-ReadableUI.exe -Algorithm SHA256 | Format-List

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: mkLS-1.18.0-Windows-x64-Portable-Single-ReadableUI
          path: dist/mkLS-1.18.0-Windows-x64-Portable-Single-ReadableUI.exe
          if-no-files-found: error
          retention-days: 7
